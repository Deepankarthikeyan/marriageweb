# Render static site — import at https://dashboard.render.com/
services:
  - type: web
    name: lavanya-balaji-wedding
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./_site
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
